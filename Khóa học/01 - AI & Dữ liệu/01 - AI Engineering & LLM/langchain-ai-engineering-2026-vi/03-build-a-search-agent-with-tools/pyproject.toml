[project]
name = "langchain-search-agent-course"
version = "0.1.0"
description = "Chương 03: ReAct AI Agents, Tavily search, Pydantic structured output"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.1",
  "langchain-openai>=1.0",
  "langchain-tavily",
  "tavily-python",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_job_agent"]
