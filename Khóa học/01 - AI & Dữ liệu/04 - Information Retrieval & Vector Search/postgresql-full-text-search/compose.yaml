services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fts
      POSTGRES_USER: fts_user
      POSTGRES_PASSWORD: dev_only_change_me
    ports:
      - "5433:5432"
    volumes:
      - fts_data:/var/lib/postgresql/data
      - ./sql/00-khoi-tao.sql:/docker-entrypoint-initdb.d/00-khoi-tao.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fts_user -d fts"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  fts_data:
