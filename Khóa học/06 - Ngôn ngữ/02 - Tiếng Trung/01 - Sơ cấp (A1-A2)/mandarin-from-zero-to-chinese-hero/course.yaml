description: "Học liệu tiếng Việt tự biên soạn, sắp xếp theo đầy đủ 56 section và 233 mục của khóa Udemy; gồm phát âm, Hanzi, HSK 1–3, bài tập và ôn luyện."
level: beginner
language: vi
tags: [tieng-trung, mandarin, pinyin, hanzi, hsk1, hsk2, hsk3]
