<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f7fafc"/>
  <style>
    .title{font:700 34px Arial,sans-serif;fill:#102a43}
    .h{font:700 24px Arial,sans-serif;fill:#102a43}
    .t{font:18px Arial,sans-serif;fill:#243b53}
    .small{font:16px Arial,sans-serif;fill:#486581}
    .head{font:700 18px Arial,sans-serif;fill:white}
    .cell{font:18px Arial,sans-serif;fill:#102a43}
  </style>
  <text x="70" y="62" class="title">Bluegill: tốc độ bơi và thay đổi động học vây ngực</text>
  <text x="70" y="96" class="small">Nghiên cứu dùng 5 mức tốc độ; quy đổi cm/s chỉ là xấp xỉ cho cá dài khoảng 18 cm.</text>
  <rect x="70" y="140" width="1460" height="62" fill="#147d92" rx="10"/>
  <text x="100" y="180" class="head">Tốc độ (TL/s)</text>
  <text x="360" y="180" class="head">Xấp xỉ (cm/s, L≈18 cm)</text>
  <text x="730" y="180" class="head">Quãng đường / chu kỳ</text>
  <text x="1040" y="180" class="head">Tần số vây / ghi chú</text>
  <g>
    <rect x="70" y="202" width="1460" height="82" fill="#e6fffa"/>
    <rect x="70" y="284" width="1460" height="82" fill="#ffffff"/>
    <rect x="70" y="366" width="1460" height="82" fill="#e6fffa"/>
    <rect x="70" y="448" width="1460" height="82" fill="#ffffff"/>
    <rect x="70" y="530" width="1460" height="82" fill="#fff5f5"/>
    <line x1="70" y1="202" x2="1530" y2="202" stroke="#bcccdc"/>
    <line x1="70" y1="284" x2="1530" y2="284" stroke="#bcccdc"/>
    <line x1="70" y1="366" x2="1530" y2="366" stroke="#bcccdc"/>
    <line x1="70" y1="448" x2="1530" y2="448" stroke="#bcccdc"/>
    <line x1="70" y1="530" x2="1530" y2="530" stroke="#bcccdc"/>
    <line x1="70" y1="612" x2="1530" y2="612" stroke="#bcccdc"/>
    <text x="130" y="253" class="cell">0,3</text><text x="390" y="253" class="cell">≈ 5,4</text><text x="780" y="253" class="cell">4,5 cm</text><text x="1080" y="253" class="cell">≈ 1,2 Hz</text>
    <text x="130" y="335" class="cell">0,5</text><text x="390" y="335" class="cell">≈ 9,0</text><text x="780" y="335" class="cell">6,4 cm</text><text x="1080" y="335" class="cell">tăng dần</text>
    <text x="130" y="417" class="cell">0,75</text><text x="390" y="417" class="cell">≈ 13,5</text><text x="780" y="417" class="cell">7,9 cm</text><text x="1080" y="417" class="cell">tăng dần</text>
    <text x="130" y="499" class="cell">1,0</text><text x="390" y="499" class="cell">≈ 18,0</text><text x="780" y="499" class="cell">8,5 cm</text><text x="1080" y="499" class="cell">≈ 2,1 Hz</text>
    <text x="130" y="581" class="cell">1,1</text><text x="390" y="581" class="cell">≈ 19,8</text><text x="780" y="581" class="cell">9,9 cm</text><text x="1080" y="581" class="cell">không tăng rõ; bắt đầu thêm thân + đuôi</text>
  </g>
  <rect x="70" y="660" width="1460" height="155" fill="white" stroke="#bcccdc" stroke-width="2" rx="16"/>
  <text x="100" y="705" class="h">Diễn giải cơ học</text>
  <text x="100" y="742" class="t">Tốc độ tăng không chỉ do đánh vây nhanh hơn: quãng đường mỗi chu kỳ cũng tăng, vận tốc đầu vây tăng,</text>
  <text x="100" y="772" class="t">biên độ theo x/y/z đổi khác và ở mức cao nhất có pause khoảng 25% chu kỳ. Tỉ lệ retraction speed / swimming speed</text>
  <text x="100" y="802" class="t">giảm khoảng 2,75 → 1,00, cho thấy slip của vây giảm khi tốc độ tăng.</text>
</svg>
