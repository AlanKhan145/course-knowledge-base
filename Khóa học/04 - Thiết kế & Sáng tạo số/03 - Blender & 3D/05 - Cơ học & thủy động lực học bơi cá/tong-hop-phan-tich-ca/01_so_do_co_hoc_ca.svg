<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <rect width="1600" height="920" fill="#f7fafc"/>
  <style>
    .title{font:700 34px Arial,sans-serif;fill:#102a43}
    .h{font:700 24px Arial,sans-serif;fill:#102a43}
    .t{font:18px Arial,sans-serif;fill:#243b53}
    .small{font:16px Arial,sans-serif;fill:#486581}
    .label{font:700 18px Arial,sans-serif;fill:#102a43}
    .box{fill:white;stroke:#bcccdc;stroke-width:2;rx:18}
    .arrow{stroke:#334e68;stroke-width:4;fill:none;marker-end:url(#arr)}
    .wave{stroke:#d64545;stroke-width:6;fill:none;stroke-dasharray:14 10}
  </style>
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334e68"/></marker>
    <marker id="arrRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#d64545"/></marker>
    <marker id="arrBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#147d92"/></marker>
  </defs>
  <text x="70" y="65" class="title">Cơ học và chuyển động của cá: từ cơ bắp đến lực đẩy</text>
  <text x="70" y="98" class="small">Sơ đồ khái niệm tổng hợp từ các khóa học nội bộ. Không theo tỷ lệ hình học.</text>

  <rect x="55" y="135" width="930" height="420" class="box"/>
  <text x="85" y="180" class="h">1. Bơi uốn sóng BCF</text>
  <text x="85" y="212" class="t">Sóng hoạt hóa và sóng uốn truyền về phía đuôi, còn cá tiến về phía trước.</text>
  <path d="M225 370 C300 275 430 260 550 340 C645 402 730 420 812 346 C850 312 885 310 915 345 C885 376 850 388 812 354 C730 285 645 302 550 365 C430 448 300 430 225 370 Z" fill="#4c6fff" opacity="0.92"/>
  <path d="M215 368 C320 260 455 290 560 362 C660 430 750 418 870 338" class="wave" marker-end="url(#arrRed)"/>
  <path d="M210 490 C420 500 675 500 930 490" class="arrow" marker-end="url(#arr)"/>
  <text x="390" y="527" class="label">hướng bơi U</text>
  <path d="M870 300 C820 250 770 245 718 268" stroke="#d64545" stroke-width="4" fill="none" marker-end="url(#arrRed)"/>
  <text x="712" y="238" class="label" fill="#d64545">sóng cơ thể → đuôi</text>
  <path d="M300 260 L255 208" class="arrow" stroke="#7b61ff"/>
  <text x="120" y="205" class="label" fill="#7b61ff">myotome kích hoạt tuần tự</text>
  <text x="100" y="585" class="small">Anguilliform: uốn cả thân • Carangiform: uốn chủ yếu 1/3 sau • Thunniform: thân gần cứng, cuống đuôi + vây đuôi tạo thrust.</text>

  <rect x="1015" y="135" width="530" height="420" class="box"/>
  <text x="1045" y="180" class="h">2. Cân bằng lực</text>
  <circle cx="1280" cy="350" r="68" fill="#4c6fff" opacity="0.92"/>
  <path d="M1280 282 L1280 220" class="arrow" stroke="#147d92" marker-end="url(#arrBlue)"/>
  <text x="1300" y="220" class="label" fill="#147d92">buoyancy + lift</text>
  <path d="M1280 418 L1280 486" class="arrow" stroke="#d64545" marker-end="url(#arrRed)"/>
  <text x="1300" y="505" class="label" fill="#d64545">weight</text>
  <path d="M1212 350 L1100 350" class="arrow" marker-end="url(#arr)"/>
  <text x="1050" y="330" class="label">drag / resistance</text>
  <path d="M1348 350 L1460 350" class="arrow" stroke="#147d92" marker-end="url(#arrBlue)"/>
  <text x="1364" y="330" class="label" fill="#147d92">thrust</text>
  <text x="1060" y="545" class="small">Tốc độ ổn định: thrust trung bình ≈ resistance trung bình.</text>

  <rect x="55" y="610" width="1490" height="255" class="box"/>
  <text x="85" y="650" class="h">3. Ba trạng thái chuyển động thường dùng khi dựng rig</text>
  <line x1="540" y1="680" x2="540" y2="835" stroke="#d9e2ec" stroke-width="2"/>
  <line x1="1040" y1="680" x2="1040" y2="835" stroke="#d9e2ec" stroke-width="2"/>
  <text x="95" y="692" class="label">Bơi thẳng: body wave + tail beat</text>
  <path d="M120 770 C190 700 260 700 330 770 C390 825 450 815 510 750" stroke="#4c6fff" stroke-width="20" fill="none"/>
  <path d="M120 820 L495 820" class="arrow" marker-end="url(#arr)"/>
  <text x="230" y="850" class="small">wake tuần hoàn / reverse Kármán</text>
  <text x="570" y="692" class="label">Vây ngực: 3 trục x–y–z</text>
  <path d="M690 760 C730 715 800 715 840 760 C800 805 730 805 690 760" stroke="#147d92" stroke-width="12" fill="none"/>
  <path d="M760 760 L900 705" class="arrow" stroke="#d64545" marker-end="url(#arrRed)"/>
  <text x="680" y="850" class="small">abduction/adduction + levation/depression + protraction/retraction</text>
  <text x="1070" y="692" class="label">Rẽ nhanh: C/S-start</text>
  <path d="M1150 730 C1240 680 1350 700 1380 765 C1350 820 1240 835 1150 790" stroke="#d64545" stroke-width="18" fill="none"/>
  <path d="M1380 770 L1490 720" class="arrow" stroke="#147d92" marker-end="url(#arrBlue)"/>
  <text x="1110" y="850" class="small">cặp xoáy mạnh → jet định hướng → force vectoring</text>
</svg>
