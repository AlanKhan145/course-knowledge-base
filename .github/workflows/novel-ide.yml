name: novel-ide

on:
  push:
    paths:
      - "projects/novel-ide/**"
      - ".github/workflows/novel-ide.yml"
  pull_request:
    paths:
      - "projects/novel-ide/**"

defaults:
  run:
    working-directory: projects/novel-ide

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/novel-ide/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
